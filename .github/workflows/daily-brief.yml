name: hep-th 데일리 브리핑

# 수집 → 한국어 번역 → 발행까지 전부 러너에서 한다. 로컬 머신이 꺼져 있어도 된다.
#
# GitHub의 schedule은 정시에 오지 않는다 (실측: 00:35 UTC cron이 03:41·04:36 UTC 발화,
# 미발화한 날도 있었다). arXiv 공지는 09:00 KST에 확정되고 fetch_arxiv.py 가
# --expect/--retries 로 "아직 전날 목록" 인 경우를 걸러내므로, 늦게 발화해도 결과는 맞다.
# 정시 실행이 필요하면 로컬에서 scripts/run_local.sh 를 직접 돌린다.
#
# 번역은 Claude Max 구독 OAuth 토큰(claude setup-token 으로 발급)을 쓴다.
# 레포 Secret 이름: CLAUDE_CODE_OAUTH_TOKEN

on:
  schedule:
    - cron: "30 0 * * 1-5"        # 09:30 KST 목표 (밀릴 수 있음)
  workflow_dispatch:
    inputs:
      date:
        description: "공지 날짜 YYYY-MM-DD. 비우면 오늘(KST)."
        required: false
        type: string
      force:
        description: "이미 발행된 날짜도 다시 만든다"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write        # 실패 시 이슈로 알림 (GitHub이 메일을 보내준다)
  id-token: write      # claude-code-action 이 OIDC 토큰을 GitHub 토큰으로 교환한다

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 날짜 결정
        id: day
        run: |
          # 작업 폴더는 워크스페이스 밖에 둔다 — sync_repo.py 의 git add -A 에 걸리지 않게.
          echo "BRIEF_WORK=$RUNNER_TEMP/brief" >> "$GITHUB_ENV"
          DATE="${{ inputs.date }}"
          [ -n "$DATE" ] || DATE="$(TZ=Asia/Seoul date +%F)"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [ -f "briefs/$DATE.html" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$DATE 는 이미 발행돼 있습니다 — 종료합니다."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 수집
        id: fetch
        if: steps.day.outputs.published == 'false'
        env:
          DATE: ${{ steps.day.outputs.date }}
        run: |
          if [ ! -f "data/$DATE.json" ]; then
            if [ -n "${{ inputs.date }}" ]; then
              python3 scripts/fetch_arxiv.py --api --date "$DATE"
            else
              python3 scripts/fetch_arxiv.py --expect "$DATE" --retries 4 --retry-wait 120
            fi
          else
            echo "data/$DATE.json 이 이미 있습니다 — 수집 생략"
          fi
          # 0편이면 fetch_arxiv.py 가 파일을 쓰지 않는다 (주말이거나 공지 전).
          if [ -f "data/$DATE.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "신규 0편 — 커밋 없이 종료합니다."
          fi

      - name: 청크 분할
        id: split
        if: steps.fetch.outputs.found == 'true'
        env:
          DATE: ${{ steps.day.outputs.date }}
        run: |
          python3 scripts/split_chunks.py "data/$DATE.json" 6
          mkdir -p "$BRIEF_WORK/out"
          ls -1 "$BRIEF_WORK/in"

      - name: 한국어 번역
        if: steps.fetch.outputs.found == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model sonnet
            --fallback-model opus
            --max-turns 120
            --allowedTools Read,Write,Glob
          prompt: |
            You are translating arXiv hep-th abstracts into Korean.

            The directory ${{ runner.temp }}/brief/in contains files chunk1.json,
            chunk2.json, ... Each is a JSON array of papers with keys
            id, title, authors, categories, abstract.

            Process EVERY chunk file, one at a time. For each paper in each chunk:

            STEP 1. Read the chunk file.

            STEP 2. Translate the abstract into Korean:
            - Natural, fluent academic Korean ("~한다/~이다" 평서체).
            - KEEP all technical/physics terminology in English (holography,
              entanglement entropy, black hole, CFT, AdS/CFT, Yang-Mills,
              supersymmetry, moduli, brane, S-matrix, stress tensor, gauge theory,
              Calabi-Yau, renormalization, ...). Keep all math notation, LaTeX,
              symbols and arXiv IDs exactly as in the original.
            - Do not translate proper nouns or model names.
            - Translate the FULL abstract sentence for sentence. Never summarize.

            STEP 3. Write the translation to ${{ runner.temp }}/brief/out/<id>.txt
            where <id> is that paper's id field (for example 2608.02696.txt).

            The .txt file contains the Korean translation and NOTHING else — no JSON,
            no quotes around it, no title, no id, no markdown fences. Write the LaTeX
            and backslashes literally as they appear; this is a plain text file, so
            nothing needs escaping.

            One .txt file per paper. Do not stop until every paper in every chunk has
            its own file in out/. Return ONLY the string "done: N papers".
            Do not return paper content.

      # 1차 검증. 실패해도 잡을 죽이지 않고 누락 목록을 만들어 재번역으로 넘긴다.
      - name: 병합·검증
        id: merge
        if: steps.fetch.outputs.found == 'true'
        continue-on-error: true
        env:
          DATE: ${{ steps.day.outputs.date }}
        run: |
          cd "$BRIEF_WORK"
          if python3 "$GITHUB_WORKSPACE/scripts/merge_ko.py" \
               "$GITHUB_WORKSPACE/data/$DATE.json" out papers.json | tee merge.txt; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            grep -E '^(MISSING|SHORT_KO)' merge.txt | awk '{print $2}' > missing.txt
            echo "재번역 대상: $(wc -l < missing.txt)편"
          fi

      # 누락·부실분만 다시 돌린다. 로컬 경로의 청크 재시도와 같은 역할.
      - name: 누락분 재번역
        if: steps.fetch.outputs.found == 'true' && steps.merge.outputs.ok != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model sonnet
            --fallback-model opus
            --max-turns 60
            --allowedTools Read,Write,Glob
          prompt: |
            Some arXiv hep-th abstracts were not translated, or the translation came
            out too short.

            ${{ runner.temp }}/brief/missing.txt lists the arXiv ids that need work,
            one per line. For EACH id in that file:

            1. Find that paper in the chunk files under ${{ runner.temp }}/brief/in/
               (each chunk is a JSON array of papers with an id field).
            2. Translate its abstract into Korean in full — natural academic Korean
               ("~한다/~이다" 평서체), all physics terminology and LaTeX kept in the
               original form, sentence for sentence, never summarized.
            3. Overwrite ${{ runner.temp }}/brief/out/<id>.txt with the translation
               and nothing else — plain text, no JSON, no quotes, no markdown fences.

            Return ONLY the string "repaired: N papers".

      - name: 재검증
        if: steps.fetch.outputs.found == 'true' && steps.merge.outputs.ok != 'true'
        env:
          DATE: ${{ steps.day.outputs.date }}
        run: |
          cd "$BRIEF_WORK"
          if ! python3 "$GITHUB_WORKSPACE/scripts/merge_ko.py" \
                 "$GITHUB_WORKSPACE/data/$DATE.json" out papers.json | tee merge.txt; then
            echo "::error::재번역 후에도 번역이 불완전합니다 — 커밋하지 않습니다."
            exit 1
          fi

      - name: 발행
        if: steps.fetch.outputs.found == 'true'
        env:
          DATE: ${{ steps.day.outputs.date }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "arxiv-hep-th-bot"
          git config user.email "noreply@anthropic.com"
          # 번역 스텝(claude-code-action)이 자체 GitHub 앱 토큰으로 git 자격증명을
          # 건드리므로, push 전에 origin 을 이 잡의 토큰으로 다시 붙여 둔다.
          # GITHUB_TOKEN 값은 Actions 로그에서 자동 마스킹된다.
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          DATESTR=$(python3 -c 'import sys,datetime
          d=datetime.date.fromisoformat(sys.argv[1])
          print("%d년 %d월 %d일 (%s)" % (d.year, d.month, d.day, "월화수목금토일"[d.weekday()]))' "$DATE")
          python3 scripts/sync_repo.py ${{ github.repository }} \
            "$BRIEF_WORK/papers.json" "$DATE" "$DATESTR"

      - name: 실패 시 로그 남기기
        if: failure() && steps.fetch.outputs.found == 'true'
        run: |
          echo "--- in ---";  ls -1 "$BRIEF_WORK/in"  2>/dev/null || true
          echo "--- out ---"; ls -1 "$BRIEF_WORK/out" 2>/dev/null || true
          cat "$BRIEF_WORK/merge.txt" 2>/dev/null || true

      # 자동 실행이라 실패해도 아무도 모른다. 이슈를 만들어 메일이 오게 한다.
      # 같은 날짜 이슈가 이미 열려 있으면 코멘트만 달아 중복을 막는다.
      - name: 실패 알림
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.day.outputs.date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="브리핑 실패: $DATE"
          BODY="$RUN_URL 에서 실패했습니다.

          재실행: Actions → hep-th 데일리 브리핑 → Run workflow (date=\`$DATE\`, force=true)

          토큰 만료가 의심되면 로컬에서 \`claude setup-token\` 후 Secret \`CLAUDE_CODE_OAUTH_TOKEN\` 을 갱신하세요."
          gh label create brief-failure --color B60205 --description "데일리 브리핑 워크플로 실패" 2>/dev/null || true
          NUM=$(gh issue list --state open --label brief-failure \
                  --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label brief-failure
          fi
