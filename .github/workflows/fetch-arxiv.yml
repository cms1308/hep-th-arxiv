name: arXiv hep-th 수집

# 매 평일 04:45 UTC (13:45 KST).
# 실측: 04:00 UTC 에는 아직 전날 피드가 온다. 04:38 UTC 에는 당일 피드가 왔다.
# 시각에만 의존하지 않도록 --expect 로 당일 공지가 나올 때까지 재시도한다(최대 +20분).
# 브리핑 예약 작업은 이보다 뒤(14:15 KST)에 돌면서 이 결과를 읽는다.
on:
  schedule:
    - cron: "45 4 * * 1-5"
  # `.trigger` 파일이 바뀌면 실행된다. 파일 첫 줄이 그대로 인자로 들어간다.
  # (에이전트는 api.github.com 을 못 쓰므로 push 로 워크플로를 직접 돌리기 위한 통로)
  push:
    paths:
      - ".trigger"
      - "scripts/fetch_arxiv.py"
      - ".github/workflows/fetch-arxiv.yml"
  workflow_dispatch:
    inputs:
      date:
        description: "백필할 공지 날짜 (YYYY-MM-DD). 비우면 오늘 RSS를 수집."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fetch-arxiv
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집
        id: fetch
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="--api --date ${{ inputs.date }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ -s .trigger ]; then
            ARGS="$(head -1 .trigger)"
          else
            ARGS="--rss --expect $(TZ=Asia/Seoul date +%F)"
          fi
          echo "실행 인자: $ARGS"
          python3 scripts/fetch_arxiv.py $ARGS

      - name: 커밋
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data)" ]; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "arxiv-fetch-bot"
          git config user.email "noreply@anthropic.com"
          git add data
          git commit -m "data: hep-th 신규 ${{ steps.fetch.outputs.count }}편 (${{ steps.fetch.outputs.date }})"
          git push
