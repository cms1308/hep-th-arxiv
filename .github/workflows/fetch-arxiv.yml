name: arXiv hep-th 수집

# 평일 09:35 KST(00:35 UTC) 자동 실행 — arXiv 공지(20:00 ET = 09:00 KST) 직후.
# 갱신 전이면 전날 목록과 동일한지 검사해 5분 간격으로 재시도한다.
# `.trigger` 파일이 바뀌어도 실행된다(파일 첫 줄이 그대로 인자).
# 브리핑 세션은 api.github.com 을 못 쓰므로, 실행 결과를 항상 data/_last_run.txt 에
# 커밋해 로그를 레포에서 읽을 수 있게 한다.
on:
  schedule:
    # arXiv 공지 = 20:00 ET. 서머타임 여부로 KST 09:00 / 10:00 로 갈린다.
    #   EDT(3~10월): 00:00 UTC = 09:00 KST  -> 아래 첫 줄이 유효
    #   EST(11~2월): 01:00 UTC = 10:00 KST  -> 아래 둘째 줄이 유효
    # 유효하지 않은 쪽은 전날 목록과 동일하다고 판정돼 커밋 없이 끝난다(무해).
    - cron: "35 0 * * 1-5"
    - cron: "35 1 * * 1-5"
  push:
    paths:
      - ".trigger"
      - "scripts/fetch_arxiv.py"
      - ".github/workflows/fetch-arxiv.yml"
  workflow_dispatch:
    inputs:
      date:
        description: "백필할 공지 날짜 (YYYY-MM-DD). 비우면 오늘분 수집."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fetch-arxiv
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 인자 결정
        id: args
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="--api --date ${{ inputs.date }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ -s .trigger ]; then
            ARGS="$(head -1 .trigger)"
          else
            ARGS="--new --expect $(TZ=Asia/Seoul date +%F) --retries 6 --retry-wait 300"
          fi
          echo "ARGS=$ARGS" >> "$GITHUB_ENV"
          echo "실행 인자: $ARGS"

      - name: 수집
        id: fetch
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/fetch_arxiv.py $ARGS 2>&1 | tee /tmp/fetch.log

      - name: 로그 남기기
        if: always()
        run: |
          mkdir -p data
          {
            echo "run       = #${{ github.run_number }}  (${{ github.event_name }})"
            echo "utc       = $(date -u +%FT%TZ)"
            echo "kst       = $(TZ=Asia/Seoul date +%FT%T)"
            echo "args      = $ARGS"
            echo "outcome   = ${{ steps.fetch.outcome }}"
            echo "--------- 출력 ---------"
            tail -60 /tmp/fetch.log 2>/dev/null || echo "(로그 없음)"
          } > data/_last_run.txt
          cat data/_last_run.txt

      - name: 커밋
        if: always()
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "변경 없음 — 커밋 생략"; exit 0
          fi
          git config user.name  "arxiv-fetch-bot"
          git config user.email "noreply@anthropic.com"
          git add data
          git commit -m "data: 수집 실행 #${{ github.run_number }} (${{ steps.fetch.outcome }})"
          git push

      - name: 실패 시 종료코드 반영
        if: steps.fetch.outcome == 'failure'
        run: exit 1
