name: arXiv hep-th 수집

# 매 평일 04:45 UTC (13:45 KST).
# 실측: 04:00 UTC 에는 아직 전날 피드가 온다. 04:38 UTC 에는 당일 피드가 왔다.
# 시각에만 의존하지 않도록 --expect 로 당일 공지가 나올 때까지 재시도한다(최대 +20분).
# 브리핑 예약 작업은 이보다 뒤(14:15 KST)에 돌면서 이 결과를 읽는다.
on:
  schedule:
    - cron: "45 4 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "백필할 공지 날짜 (YYYY-MM-DD). 비우면 오늘 RSS를 수집."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fetch-arxiv
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집
        id: fetch
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.date }}" ]; then
            python3 scripts/fetch_arxiv.py --api --date "${{ inputs.date }}"
          else
            python3 scripts/fetch_arxiv.py --rss --expect "$(TZ=Asia/Seoul date +%F)"
          fi

      - name: 커밋
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data)" ]; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "arxiv-fetch-bot"
          git config user.email "noreply@anthropic.com"
          git add data
          git commit -m "data: hep-th 신규 ${{ steps.fetch.outputs.count }}편 (${{ steps.fetch.outputs.date }})"
          git push
