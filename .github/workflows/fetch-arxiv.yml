name: arXiv hep-th 수집

# 브리핑 세션이 `scripts/collect.py` 로 .trigger 를 push 하면 실행된다.
# cron은 쓰지 않는다 — GitHub의 schedule은 수 시간까지 밀려서 11:00 KST 브리핑 전에
# 끝난다는 보장이 없었다(실측: 00:35 UTC cron이 03:41/04:36 UTC에 발화).
# 세션이 직접 띄우고 결과 커밋을 기다리는 편이 빠르고 확실하다.
#
# 브리핑 세션은 api.github.com 을 못 쓰므로, 실행 결과를 항상 data/_last_run.txt 에
# 커밋해 로그를 레포에서 읽을 수 있게 한다.

on:
  push:
    paths:
      - ".trigger"
  workflow_dispatch:
    inputs:
      date:
        description: "백필할 공지 날짜 (YYYY-MM-DD). 비우면 오늘분 수집."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fetch-arxiv
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 인자 결정
        id: args
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="--api --date ${{ inputs.date }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ -s .trigger ]; then
            ARGS="$(head -1 .trigger)"
          else
            ARGS="--expect $(TZ=Asia/Seoul date +%F) --retries 4 --retry-wait 120"
          fi
          echo "ARGS=$ARGS" >> "$GITHUB_ENV"
          echo "실행 인자: $ARGS"

      - name: 수집
        id: fetch
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/fetch_arxiv.py $ARGS 2>&1 | tee /tmp/fetch.log

      - name: 로그 남기기
        if: always()
        run: |
          mkdir -p data
          {
            echo "run       = #${{ github.run_number }}  (${{ github.event_name }})"
            echo "utc       = $(date -u +%FT%TZ)"
            echo "kst       = $(TZ=Asia/Seoul date +%FT%T)"
            echo "args      = $ARGS"
            echo "outcome   = ${{ steps.fetch.outcome }}"
            echo "--------- 출력 ---------"
            tail -60 /tmp/fetch.log 2>/dev/null || echo "(로그 없음)"
          } > data/_last_run.txt
          cat data/_last_run.txt

      - name: 커밋
        if: always()
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "변경 없음 — 커밋 생략"; exit 0
          fi
          git config user.name  "arxiv-fetch-bot"
          git config user.email "noreply@anthropic.com"
          git add data
          git commit -m "data: 수집 실행 #${{ github.run_number }} (${{ steps.fetch.outcome }})"
          git push

      - name: 실패 시 종료코드 반영
        if: steps.fetch.outcome == 'failure'
        run: exit 1
